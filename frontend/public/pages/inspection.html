<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety Inspection — S7Gear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>

<body data-page="inspection">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main>
      <header class="topbar"><b>Safety Inspection</b></header>

      <div class="content">
        <h2 class="title">Safety Inspection</h2>
        <p class="subtitle">Record a safety inspection for a power tool — <span id="todayText"></span></p>

        <div class="grid-side inspection-grid">

          <!-- ============ Tool list and inspection history ============ -->
          <div class="inspection-tools-column">
            <div class="card mb">
              <div class="card-h">Inspection Schedule</div>
              <div class="card-b">
                <p class="info-text mt-0" id="inspectionScheduleStatus" aria-live="polite"></p>
                <form id="scheduleInspectionForm">
                  <div class="field">
                    <label for="scheduleDate">NEXT INSPECTION DATE</label>
                    <input id="scheduleDate" type="date" required>
                  </div>
                  <button class="btn primary full" id="scheduleSubmit">Schedule Inspection</button>
                </form>
              </div>
            </div>

            <div class="card mb">
              <div class="card-h">Tools</div>
              <div class="toolbar">
                <input id="findToolId" type="search" placeholder="Search by tool ID, type, or category" aria-label="Search tools">
                <select id="inspectionStatusFilter" aria-label="Filter inspection status">
                  <option value="all">All tools</option>
                  <option value="pending">Not inspected</option>
                  <option value="inspected">Inspected</option>
                </select>
              </div>
              <div class="card-b">
                <div id="inspectionToolList"></div>
                <!-- Selected tool summary -->
                <div id="selectedTool"></div>
              </div>
            </div>

            <div class="card">
              <div class="card-h">Inspection History</div>
              <div id="recentList"></div>
            </div>
          </div>

          <!-- ============ Checklist and inspection details ============ -->
          <div>
            <div class="card mb">
              <div class="card-h">
                Safety Checklist
                <span class="card-note" id="checkedCount"></span>
              </div>
              <!-- Checklist rows are built from CHECKLIST_ITEMS in script/pages/inspection.js -->
              <div class="table-wrap">
                <table class="check">
                  <thead>
                    <tr><th>ITEM</th><th class="col-check">CHECK</th></tr>
                  </thead>
                  <tbody id="checklistBody"></tbody>
                </table>
              </div>
            </div>

            <div class="card">
              <div class="card-h">Inspection Result</div>
              <div class="card-b">
                <form id="inspectionForm">
                  <div class="fgrid">
                    <div class="field">
                      <label>INSPECTOR *</label>
                      <select name="inspectorId" id="inspector" required></select>
                    </div>
                    <div class="field">
                      <label>INSPECTION DATE</label>
                      <input type="date" name="date" id="inspectionDate">
                    </div>
                  </div>

                  <div class="field">
                    <label>INSPECTION RESULT *</label>
                    <div class="seg" id="resultButtons">
                      <button type="button" data-result="Passed">Passed</button>
                      <button type="button" data-result="Needs Maintenance">Needs Maintenance</button>
                    </div>
                  </div>

                  <div class="field">
                    <label>FINDINGS</label>
                    <textarea name="findings" placeholder="Describe what was found..."></textarea>
                  </div>
                  <!-- Explains what will happen to the tool (shown after a result is chosen) -->
                  <div class="note hidden" id="resultNote"></div>

                  <button class="btn primary full">Save Inspection</button>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="../script/pages/inspection.js"></script>
</body>
</html>
