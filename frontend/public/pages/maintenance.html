<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance — S7Gear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body data-page="maintenance">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <header class="topbar"><b>Maintenance</b></header>
      <div class="content">
        <h2 class="title">Maintenance Management</h2>
        <p class="subtitle">Record repairs and track tools under maintenance.</p>

        <div class="grid-side">
          <div class="card">
            <div class="card-h">Record Maintenance</div>
            <div class="card-b">
              <form id="maintenanceForm">
                <div class="field">
                  <label for="maintenanceTool">TOOL *</label>
                  <select name="toolId" id="maintenanceTool" required></select>
                </div>
                <div class="field">
                  <label for="maintenanceDate">DATE *</label>
                  <input type="date" name="date" id="maintenanceDate" required>
                </div>
                <div class="field">
                  <label for="maintenanceType">MAINTENANCE TYPE *</label>
                  <input name="type" id="maintenanceType" required maxlength="100" placeholder="e.g. Repair">
                </div>
                <div class="field">
                  <label for="maintenanceIssue">ISSUE *</label>
                  <textarea name="issue" id="maintenanceIssue" required placeholder="Describe the fault or maintenance needed..."></textarea>
                </div>
                <div class="field">
                  <label for="maintenanceAction">ACTION TAKEN / PLANNED *</label>
                  <textarea name="action" id="maintenanceAction" required placeholder="Describe the action..."></textarea>
                </div>
                <button class="btn primary full">Save Maintenance Record</button>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-h">Maintenance Records</div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>ID</th><th>TOOL</th><th>DATE</th><th>TYPE</th><th>ISSUE</th><th>ACTION</th><th>STATUS</th><th></th></tr>
                </thead>
                <tbody id="maintenanceBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="../script/pages/maintenance.js"></script>
</body>
</html>
