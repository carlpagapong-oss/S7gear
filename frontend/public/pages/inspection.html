<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety Inspection — S7Gear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>

<body data-page="inspection">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main>
      <header class="topbar"><b>Safety Inspection</b></header>

      <div class="content">
        <h2 class="title">Safety Inspection</h2>
        <p class="subtitle">Record a safety inspection for a power tool — <span id="todayText"></span></p>

        <div class="grid-side">

          <!-- ============ Left column ============ -->
          <div>
            <div class="card mb">
              <div class="card-h">Find Tool</div>
              <div class="card-b">
                <form id="findForm" class="row find-form">
                  <input id="findToolId" placeholder="e.g. PT-001">
                  <button class="btn primary">Go</button>
                </form>
                <!-- Selected tool summary -->
                <div id="selectedTool"></div>
              </div>
            </div>

            <div class="card">
              <div class="card-h">Recent Inspections</div>
              <div id="recentList"></div>
            </div>
          </div>

          <!-- ============ Right column ============ -->
          <div>
            <div class="card mb">
              <div class="card-h">
                Safety Checklist
                <span class="card-note" id="checkedCount"></span>
              </div>
              <!-- Checklist rows are built from CHECKLIST_ITEMS in script/pages/inspection.js -->
              <div class="table-wrap">
                <table class="check">
                  <thead>
                    <tr><th>ITEM</th><th class="col-check">CHECK</th></tr>
                  </thead>
                  <tbody id="checklistBody"></tbody>
                </table>
              </div>
            </div>

            <div class="card">
              <div class="card-h">Inspection Result</div>
              <div class="card-b">
                <form id="inspectionForm">
                  <div class="fgrid">
                    <div class="field">
                      <label>INSPECTOR *</label>
                      <select name="inspectorId" id="inspector" required></select>
                    </div>
                    <div class="field">
                      <label>INSPECTION DATE</label>
                      <input type="date" name="date" id="inspectionDate">
                    </div>
                  </div>

                  <div class="field">
                    <label>INSPECTION RESULT *</label>
                    <div class="seg" id="resultButtons">
                      <button type="button" data-result="Passed">Passed</button>
                      <button type="button" data-result="Needs Maintenance">Needs Maintenance</button>
                      <button type="button" data-result="Failed / Unsafe">Failed / Unsafe</button>
                    </div>
                  </div>

                  <div class="field">
                    <label>FINDINGS</label>
                    <textarea name="findings" placeholder="Describe what was found..."></textarea>
                  </div>
                  <div class="field">
                    <label>REMARKS</label>
                    <textarea name="remarks" placeholder="Additional notes or recommendations..."></textarea>
                  </div>

                  <!-- Explains what will happen to the tool (shown after a result is chosen) -->
                  <div class="note hidden" id="resultNote"></div>

                  <button class="btn primary full">Save Inspection</button>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="../script/pages/inspection.js"></script>
</body>
</html>
